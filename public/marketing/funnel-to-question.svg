<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 200" role="img" aria-label="Everything you do funnels into one simple question">
  <!-- classic funnel: wide mouth → taper → spout -->
  <path
    d="M40 24
       L960 24
       L580 128
       L580 152
       L420 152
       L420 128
       Z"
    fill="#ef4444"
    fill-opacity="0.1"
    stroke="#ef4444"
    stroke-width="5"
    stroke-linejoin="round"
    stroke-linecap="round"
  />
  <!-- spout stem -->
  <line
    x1="500"
    y1="152"
    x2="500"
    y2="172"
    stroke="#ef4444"
    stroke-width="5"
    stroke-linecap="round"
  />
  <!-- arrow tip -->
  <path
    d="M470 168 L500 192 L530 168"
    fill="none"
    stroke="#ef4444"
    stroke-width="5"
    stroke-linejoin="round"
    stroke-linecap="round"
  />
</svg>
